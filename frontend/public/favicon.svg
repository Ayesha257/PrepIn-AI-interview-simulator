<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="PrepIn">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED9E59"/>
      <stop offset="100%" stop-color="#E98CB9"/>
    </linearGradient>
    <linearGradient id="soft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED9E59" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E98CB9" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ED9E59" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#E98CB9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#05040a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark rounded tile so tab icon reads on light/dark chrome -->
  <rect width="100" height="100" rx="22" fill="#0B0A12"/>
  <circle cx="50" cy="48" r="42" fill="url(#glow)"/>

  <!-- Orbit dashes -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="18s" repeatCount="indefinite"/>
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="0.5 13" opacity="0.55"/>
  </g>

  <!-- Speech bubble -->
  <rect x="18" y="20" width="64" height="44" rx="17" fill="url(#soft)" stroke="url(#g)" stroke-width="3"/>
  <path d="M32 62 C30 68 26 74 20 78 C28 77 35 73 38 66 C37 64 35 63 32 62 Z" fill="url(#g)"/>

  <!-- Typing dots (animated) -->
  <circle cx="36" cy="41" r="4.2" fill="url(#g)">
    <animate attributeName="cy" values="41;37;41" dur="1.1s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.1s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="41" r="4.2" fill="url(#g)">
    <animate attributeName="cy" values="41;37;41" dur="1.1s" begin="0.16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.1s" begin="0.16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="64" cy="41" r="4.2" fill="url(#g)">
    <animate attributeName="cy" values="41;37;41" dur="1.1s" begin="0.32s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.1s" begin="0.32s" repeatCount="indefinite"/>
  </circle>
</svg>
